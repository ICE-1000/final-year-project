spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# FIXED: previous default was 53 chars (< 64 bytes required for HS512), which made
# JwtTokenProvider's own startup check fail on any fresh clone that didn't set
# JWT_SECRET manually. This default is long enough to pass that check for local dev.
# ALWAYS override this with a real secret in any real deployment:
#   openssl rand -base64 64
jwt.secret=${JWT_SECRET:local-development-only-secret-key-please-override-with-a-real-JWT_SECRET-env-var-before-any-real-deployment}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=${PORT:8080}
## Default CORS allowed origins. Override with CORS_ALLOWED_ORIGINS env var.
## By default allow the deployed frontend and common local dev origins.
## FIXED: removed the trailing slash on unza.netlify.app - CorsConfig does an exact
## string match against the browser's Origin header, which never includes a trailing
## slash, so the old value silently never matched in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://final-year-project-oref.onrender.com,http://localhost:5500,http://127.0.0.1,https://unza.netlify.app}

# here we put an admin if non in the database...
app.bootstrap.admin-username=${ADMIN_BOOTSTRAP_USERNAME:}
app.bootstrap.admin-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}
