<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Reports</title>
    <link rel="stylesheet" href="../css/department.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-im3">
<div class="app-layout">
    <aside class="sidebar">
        <div class="logo">IMS</div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-table-columns"></i> Dashboard</a>
            <a href="my-inventory.html"><i class="fas fa-box"></i> My Inventory</a>
            <a class="active" href="reports.html"><i class="fas fa-file-export"></i> Reports</a>
            <a href="#" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="page-header"><h1>Reports</h1></header>
        <section class="panel actions">
            <button id="pdfReport"><i class="fa-solid fa-file-pdf"></i> My Department PDF</button>
            <button class="button secondary" id="excelReport"><i class="fa-solid fa-file-excel"></i> My Department Excel</button>
        </section>
    </main>
</div>
<script src="../js/api.js"></script>
<script>
requireAuth('DEPARTMENT');
document.getElementById('pdfReport').addEventListener('click', () => downloadFile(`${API_BASE}/reports/department.pdf`, 'department-report.pdf'));
document.getElementById('excelReport').addEventListener('click', () => downloadFile(`${API_BASE}/reports/department.xlsx`, 'department-report.xlsx'));
</script>
</body>
</html>
