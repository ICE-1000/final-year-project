<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - IMS Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .user-table-container { background: white; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
        .user-table { width: 100%; border-collapse: collapse; }
        .user-table th { background: #f8fafc; padding: 14px 16px; font-weight: 600; font-size: 13px; color: var(--muted); text-align: left; border-bottom: 1px solid var(--line); }
        .user-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .user-table tr:last-child td { border-bottom: none; }
        .user-table tr:hover { background: #f9fafb; }
        .role-badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .role-badge.admin { background: #fee2e2; color: #b91c1c; }
        .role-badge.department { background: #e0f2e9; color: #0a5c3e; }
        .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-delete { color: var(--danger); }
        .btn-delete:hover { background: #fee2e2; color: #b91c1c; }
        .empty-state { text-align: center; padding: 40px; color: var(--muted); }
        .success-message, .error-message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; align-items: center; gap: 10px; }
        .success-message { background: #e0f2e9; color: #0a5c3e; }
        .error-message { background: #fee2e2; color: var(--danger); }
        .loading-spinner { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body class="bg-im1">
<div class="app-layout">
    <aside class="sidebar">
        <div class="logo">IMS</div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="inventory.html"><i class="fas fa-boxes-stacked"></i> Inventory</a>
            <a href="allocation.html"><i class="fas fa-share-nodes"></i> Allocation</a>
            <a href="categories.html"><i class="fas fa-tags"></i> Categories</a>
            <a href="registrations.html"><i class="fas fa-share-nodes"></i> Registration requests</a>
            <a href="requests.html"><i class="fas fa-list"></i> Inventory Requests</a>
            <a href="departments.html"><i class="fas fa-building"></i> Departments</a>
            <a class="active" href="users.html"><i class="fas fa-users"></i> Users</a>
            <a href="scan.html"><i class="fas fa-camera"></i> Scan Barcode</a>
            <a href="barcode-generator.html"><i class="fas fa-barcode"></i> Barcode</a>
            <a href="reports.html"><i class="fas fa-file-export"></i> Reports</a>
            <a href="#" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="page-header"><h1><i class="fas fa-users" style="margin-right: 10px; color: var(--accent);"></i> User Management</h1></header>

        <div id="successMessage" class="success-message"><i class="fas fa-check-circle"></i> <span id="successText"></span></div>
        <div id="errorMessage" class="error-message"><i class="fas fa-exclamation-circle"></i> <span id="errorText"></span></div>

        <div class="user-table-container">
            <div style="padding: 16px 20px; border-bottom: 1px solid var(--line); background: #fafcfc;">
                <i class="fas fa-list-ul"></i> <strong>All Users</strong>
                <span id="userCount" style="float: right; font-size: 13px; color: var(--muted);"></span>
            </div>
            <div id="usersList">
                <div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading users...</div>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-card">
        <h2>Edit User</h2>
        <form id="editUserForm" class="grid">
            <input type="hidden" id="editUserId">
            <label>Username <input type="text" id="editUsername" required></label>
            <label>Email <input type="email" id="editEmail" required></label>
            <label>New Password <input type="password" id="editPassword" placeholder="Leave blank to keep current password"></label>
            <label>Role
                <select id="editRole" required>
                    <option value="ADMIN">ADMIN</option>
                    <option value="DEPARTMENT">DEPARTMENT</option>
                </select>
            </label>
            <div id="editDepartmentField" style="display:none;">
                <label>Department <select id="editDepartmentId"></select></label>
            </div>
            <div class="actions" style="margin-top: 8px;">
                <button type="submit"><i class="fas fa-save"></i> Save Changes</button>
                <button type="button" id="cancelEditBtn" class="button secondary">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    requireAuth('ADMIN');

    const usersList = document.getElementById('usersList');
    const userCountSpan = document.getElementById('userCount');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    const successText = document.getElementById('successText');
    const errorText = document.getElementById('errorText');

    const editModal = document.getElementById('editModal');
    const editUserForm = document.getElementById('editUserForm');
    const editUserId = document.getElementById('editUserId');
    const editUsername = document.getElementById('editUsername');
    const editEmail = document.getElementById('editEmail');
    const editPassword = document.getElementById('editPassword');
    const editRole = document.getElementById('editRole');
    const editDepartmentField = document.getElementById('editDepartmentField');
    const editDepartmentId = document.getElementById('editDepartmentId');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    let departmentsCache = [];

    function showSuccess(msg) {
        successText.textContent = msg;
        successMessage.style.display = 'flex';
        setTimeout(() => { successMessage.style.display = 'none'; }, 3000);
    }
    function showError(msg) {
        errorText.textContent = msg;
        errorMessage.style.display = 'flex';
        setTimeout(() => { errorMessage.style.display = 'none'; }, 4000);
    }

    async function loadDepartmentsForSelect() {
        departmentsCache = await api('/departments');
        editDepartmentId.innerHTML = departmentsCache.map(d => `<option value="${d.id}">${escapeHtml(d.departmentName)}</option>`).join('');
    }

    // Toggles the department field's visibility to match whichever role is
    // currently selected - shared by the manual role-select change handler and
    // by openEditModal below (called explicitly there instead of relying on a
    // programmatic .value set to fire a 'change' event, which it doesn't).
    function syncDepartmentFieldVisibility() {
        editDepartmentField.style.display = editRole.value === 'DEPARTMENT' ? 'block' : 'none';
    }
    editRole.addEventListener('change', syncDepartmentFieldVisibility);

    async function loadUsers() {
        try {
            usersList.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading users...</div>';
            const users = await api('/users');

            if (!users || users.length === 0) {
                usersList.innerHTML = '<div class="empty-state">No users found.</div>';
                userCountSpan.textContent = '0 users';
                return;
            }

            usersList.innerHTML = `
                <table class="user-table">
                    <thead>
                        <tr><th>Username</th><th>Email</th><th>Role</th><th>Department</th><th>Created</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${users.map(u => `
                            <tr data-user-id="${u.id}">
                                <td><strong>${escapeHtml(u.username)}</strong></td>
                                <td>${escapeHtml(u.email)}</td>
                                <td><span class="role-badge ${u.role === 'ADMIN' ? 'admin' : 'department'}">${escapeHtml(u.role)}</span></td>
                                <td>${escapeHtml(u.departmentName || '-')}</td>
                                <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-'}</td>
                                <td>
                                    <button class="btn-icon" data-edit="${u.id}" title="Edit User"><i class="fas fa-pen"></i></button>
                                    <button class="btn-icon btn-delete" data-delete="${u.id}" title="Delete User"><i class="fas fa-trash-alt"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            userCountSpan.textContent = `${users.length} user${users.length !== 1 ? 's' : ''}`;

            document.querySelectorAll('[data-edit]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const user = users.find(u => u.id === btn.getAttribute('data-edit'));
                    if (user) openEditModal(user);
                });
            });
            document.querySelectorAll('[data-delete]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const user = users.find(u => u.id === btn.getAttribute('data-delete'));
                    if (!user) return;
                    if (confirm(`Delete user "${user.username}"? This cannot be undone.`)) {
                        try {
                            await api(`/users/${user.id}`, { method: 'DELETE' });
                            showSuccess('User deleted');
                            await loadUsers();
                        } catch (err) {
                            showError(err.message || 'Failed to delete user');
                        }
                    }
                });
            });
        } catch (err) {
            usersList.innerHTML = `<div class="empty-state">Failed to load users: ${escapeHtml(err.message)}</div>`;
            showError('Failed to load users: ' + err.message);
        }
    }

    async function openEditModal(user) {
        if (departmentsCache.length === 0) {
            await loadDepartmentsForSelect().catch(() => {});
        }
        editUserId.value = user.id;
        editUsername.value = user.username;
        editEmail.value = user.email;
        editPassword.value = '';
        editRole.value = user.role;
        // FIXED: setting .value programmatically doesn't fire 'change', so the
        // department field's visibility previously stayed stuck on whatever the
        // form last showed rather than reflecting the user actually being edited.
        // Call the same sync function the manual change handler uses.
        syncDepartmentFieldVisibility();
        if (user.departmentId) editDepartmentId.value = user.departmentId;
        editModal.classList.add('visible');
    }

    function closeEditModal() {
        editModal.classList.remove('visible');
    }

    cancelEditBtn.addEventListener('click', closeEditModal);
    editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
    });

    editUserForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            username: editUsername.value.trim(),
            email: editEmail.value.trim(),
            role: editRole.value,
            departmentId: editRole.value === 'DEPARTMENT' ? editDepartmentId.value : null
        };
        // Omit password entirely when left blank - backend treats a missing/blank
        // value as "leave unchanged".
        if (editPassword.value.trim()) {
            body.password = editPassword.value;
        }
        try {
            await api(`/users/${editUserId.value}`, { method: 'PUT', body: JSON.stringify(body) });
            showSuccess('User updated');
            closeEditModal();
            await loadUsers();
        } catch (err) {
            showError(err.message || 'Failed to update user');
        }
    });

    loadUsers();
</script>
</body>
</html>
