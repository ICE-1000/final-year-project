<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Barcode</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-im1">
<div class="app-layout">
    <aside class="sidebar">
        <div class="logo">IMS</div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="inventory.html"><i class="fas fa-boxes-stacked"></i> Inventory</a>
            <a href="allocation.html"><i class="fas fa-share-nodes"></i> Allocation</a>
            <a href="categories.html"><i class="fas fa-tags"></i> Categories</a>
            <a class="active" href="scan.html"><i class="fas fa-camera"></i> Scan Barcode</a>
            <a href="barcode-generator.html"><i class="fas fa-barcode"></i> Barcode</a>
            <a href="reports.html"><i class="fas fa-file-export"></i> Reports</a>
            <a href="#" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="page-header"><h1>Scan Barcode</h1></header>
        <section class="panel" id="scanPanel">
            <!--
              Works two ways at once:
              - A USB/Bluetooth hardware scanner "types" into this input and
                sends Enter automatically - no extra setup needed.
              - Staff without a scanner can click "Use Camera" instead.
            -->
            <div class="actions">
                <input id="manualBarcode" placeholder="Scan or type a barcode, then press Enter" autocomplete="off">
                <button type="button" id="lookupBtn"><i class="fa-solid fa-magnifying-glass"></i> Look Up</button>
                <button type="button" id="toggleCameraBtn"><i class="fa-solid fa-camera"></i> Use Camera</button>
            </div>
            <div id="scanner-container" class="scanner" style="display:none; margin-top:16px;"></div>
            <h2 id="scanResult" style="margin-top:16px;"></h2>
            <div id="scanItem"></div>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/quagga2@1.0.0-beta.2/dist/quagga.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/barcode.js"></script>
</body>
</html>
